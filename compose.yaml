name: music-catalog

x-database-env: &database-env
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-music_catalog}
  POSTGRES_USER: ${POSTGRES_USER:-catalog}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:17-alpine
    environment: *database-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: music-catalog-app:local
    build:
      context: .
      target: runtime
    environment: *database-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: music-catalog-app:local
    build:
      context: .
      target: runtime
    environment:
      <<: *database-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
